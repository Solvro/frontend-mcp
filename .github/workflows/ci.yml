name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  check:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  publish:
    name: Publish image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [check]
    permissions:
      contents: read
      packages: write
    # Queued, never parallel: an older run finishing last would move `main` backwards.
    concurrency:
      group: publish-main
      cancel-in-progress: false
    env:
      IMAGE: ghcr.io/solvro/frontend-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=frontend-mcp
          cache-to: type=gha,mode=max,scope=frontend-mcp
      - name: Check the image carries no keys or env files
        run: |
          ref="$IMAGE:sha-$GITHUB_SHA"
          docker pull -q "$ref" >/dev/null
          found=$(docker run --rm --entrypoint sh "$ref" -c \
            'find /app -path /app/node_modules -prune -o \( -name "*.pem" -o -name ".env" -o -name ".env.*" \) -print')
          if [ -n "$found" ]; then
            echo "::error::the image contains key or env files:"
            echo "$found"
            exit 1
          fi
      - name: Move the main tag
        run: |
          # A newer commit may already be on main (its run queued behind this one, or this one
          # re-run later): never move the tag back to an older commit.
          head=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}" refs/heads/main | cut -f1)
          if [ "$head" != "$GITHUB_SHA" ]; then echo "main is now $head; not moving the tag to $GITHUB_SHA"; exit 0; fi
          docker buildx imagetools create -t "$IMAGE:main" "$IMAGE:sha-$GITHUB_SHA"
